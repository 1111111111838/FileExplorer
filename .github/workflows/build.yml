name: Build Wikipedia Hebrew (nopic) ZIM

on:
  workflow_dispatch: # מאפשר הפעלה ידנית מתוך לשונית Actions

jobs:
  build-zim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p ${{ github.workspace }}/output

      - name: Download and package Wikipedia (Text Only)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/output:/output \
            ghcr.io/openzim/mwoffliner:latest \
            mwoffliner \
            --mwUrl=https://he.wikipedia.org/ \
            --adminEmail=RS0556780310@gmail.com \
            --outputDirectory=/output \
            --format=nopic \
            --requestTimeout=300

      - name: Upload ZIM file as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wikipedia-hebrew-nopic-zim
          path: ${{ github.workspace }}/output/*.zim
          retention-days: 7
